name: conficircle
description: "ConfiCircle - Discover. Grow. Belong."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3
  retrofit: ^4.1.0
  flutter_secure_storage: ^9.0.0
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
