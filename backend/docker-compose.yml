name: conficircle-backend

x-common: &common
  restart: unless-stopped
  networks:
    - conficircle-internal

services:
  postgres:
    <<: *common
    image: postgres:16.2-alpine
    container_name: conficircle-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conficircle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: identity_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-14332}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conficircle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *common
    image: redis:7.2-alpine
    container_name: conficircle-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *common
    image: rabbitmq:3.13-management-alpine
    container_name: conficircle-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-conficircle}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in backend/.env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-56780}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15690}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  conficircle-internal:
    driver: bridge
    internal: false
