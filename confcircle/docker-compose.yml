name: confcircle

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - confcircle-net

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: confcircle-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-confcircle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-confcircle}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-confcircle} -d ${POSTGRES_DB:-confcircle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: confcircle-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *service-defaults
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: confcircle-api
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-confcircle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-confcircle}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *service-defaults
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: worker
    container_name: confcircle-worker
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-confcircle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-confcircle}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

networks:
  confcircle-net:
    driver: bridge

